      content: '';

      inset: 0;
      opacity: 0.02;

    }

    /* Status badge pulse ring */
    .pulse-ring {
      position: relative;
    }
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0;
      animation: ripple 2s ease-out infinite;

    /* Custom transitions */
    * {

    function formatAgo(d) {
      const s = Math.floor((Date.now() - d) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
    }

              className="absolute rounded-full bg-emerald-400 animate-float"

                top: `${p.top}%`,
                width: `${p.size}px`,
                height: `${p.size}px`,

                  <span className="text-6xl lg:text-7xl">{config.icon}</span>

    // ────────────────────────────────────────────────────────────
    //  NOTIFICATION CONTROLS
    // ────────────────────────────────────────────────────────────
    function NotificationControls({ isMuted, onToggleMute, onTest }) {
      return (
        <div className="flex items-center gap-2.5">
          <button
            id="btn-test-notification"
            onClick={onTest}
            className="glass-subtle hover:bg-slate-700/60 text-slate-300 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-2 cursor-pointer active:scale-95 hover:scale-[1.02]"
          >
            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>

              isMuted

                : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/25 hover:bg-emerald-500/25'
            }`}
          >
            {isMuted ? (
              <><svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg> Muted</>
            ) : (
              <><svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg> Sound On</>

    // ────────────────────────────────────────────────────────────
    //  STATS GRID
    // ────────────────────────────────────────────────────────────
    function StatsGrid({ history, startTime }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 30000);
        return () => clearInterval(t);
      }, []);

      const totalAlerts = history.filter(h => h.status !== 'Normal').length;
      const diff = Math.floor((now - startTime) / 1000);
      const runtime = `${Math.floor(diff / 3600)}h ${Math.floor((diff % 3600) / 60)}m`;

      const gestureCounts = {};
      history.forEach(h => { if (h.status !== 'Normal') gestureCounts[h.status] = (gestureCounts[h.status] || 0) + 1; });
      const topGesture = Object.keys(gestureCounts).length > 0
        ? Object.entries(gestureCounts).sort((a, b) => b[1] - a[1])[0][0]
        : '—';

      const stats = [
        { label: 'Total Alerts', value: totalAlerts, color: 'orange', icon: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg> },
        { label: 'Active Runtime', value: runtime, color: 'blue', icon: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> },
        { label: 'Most Frequent', value: topGesture, color: 'violet', icon: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}><path strokeLinecap="round" strokeLinejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg> },
        { label: 'Total Events', value: history.length, color: 'emerald', icon: <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" /></svg> },
      ];

      return (
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          {stats.map((s, i) => {
            const c = COLOR_MAP[s.color];
            return (
              <div key={i} className="glass rounded-xl p-5 gradient-border-green hover:scale-[1.03] transition-transform duration-300 group cursor-default">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">{s.label}</span>
                  <div className={`p-2 rounded-lg ${c.bgLight} ${c.text} group-hover:scale-110 transition-transform`}>
                    {s.icon}
                  </div>
                </div>
                <div className={`text-2xl lg:text-3xl font-bold ${c.text} animate-slide-up`} key={s.value}>
                  {s.value}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────
    //  GESTURE BAR CHART (Chart.js)
    // ────────────────────────────────────────────────────────────
    function GestureChart({ history }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const counts = {};
        ALERT_GESTURES.forEach(g => counts[g] = 0);
        history.forEach(h => { if (ALERT_GESTURES.includes(h.status)) counts[h.status]++; });

        const gestureColors = ALERT_GESTURES.map(g => {
          const c = GESTURE_CONFIG[g]?.color || 'emerald';
          return COLOR_MAP[c] || COLOR_MAP.emerald;
        });

        if (chartRef.current) {
          chartRef.current.data.datasets[0].data = Object.values(counts);
          chartRef.current.update('none');
          return;
        }

        chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: 'bar',
          data: {
            labels: ALERT_GESTURES,
            datasets: [{
              label: 'Count',
              data: Object.values(counts),
              backgroundColor: gestureColors.map(c => c.chart),
              borderColor: gestureColors.map(c => c.chartBorder),
              borderWidth: 1.5,
              borderRadius: 10,
              borderSkipped: false,
              barThickness: 32,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                borderColor: 'rgba(100, 116, 139, 0.2)',
                borderWidth: 1,
                titleFont: { family: 'Inter', weight: '600' },
                bodyFont: { family: 'Inter' },
                padding: 14,
                cornerRadius: 10,
                displayColors: false,
              },
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: 'rgba(148, 163, 184, 0.5)', font: { family: 'Inter', size: 11, weight: '500' } },
                border: { display: false },
              },
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(148, 163, 184, 0.05)', drawBorder: false },
                ticks: { color: 'rgba(148, 163, 184, 0.4)', font: { family: 'Inter', size: 11 }, stepSize: 1 },
                border: { display: false },
              },
            },
          },
        });

        return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
      }, [history]);

      return (
        <div className="glass rounded-xl gradient-border-green overflow-hidden">
          <div className="p-5 pb-4 border-b border-slate-800/30">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-200">Gesture Distribution</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">Frequency of each patient gesture today</p>
              </div>
              <div className="p-2 rounded-lg bg-blue-500/10 text-blue-400">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
              </div>
            </div>
          </div>
          <div className="p-5 h-56">
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────
    //  GESTURE HISTORY TIMELINE
    // ────────────────────────────────────────────────────────────
    function GestureHistory({ history }) {
      const containerRef = useRef(null);
      useEffect(() => { if (containerRef.current) containerRef.current.scrollTop = 0; }, [history.length]);

      const reversed = [...history].reverse();

      return (
        <div className="glass rounded-xl gradient-border-green flex flex-col h-full overflow-hidden">
          <div className="p-5 border-b border-slate-800/30 flex items-center justify-between flex-shrink-0">
            <div>
              <h3 className="text-sm font-bold text-slate-200">Gesture History</h3>
              <p className="text-[11px] text-slate-500 mt-0.5">{history.length} events recorded this session</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-1 rounded-full bg-slate-800/50 border border-slate-700/30 text-[10px] font-bold text-slate-400 tracking-wider">LIVE</span>
            </div>
          </div>

          <div ref={containerRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-1" style={{ maxHeight: '520px' }}>
            {reversed.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-slate-600 py-16">
                <svg className="w-12 h-12 mb-4 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p className="text-sm font-medium">Waiting for gestures...</p>
                <p className="text-xs text-slate-700 mt-1">Events will appear here in real-time</p>
              </div>
            ) : (
              reversed.map((entry, i) => {
                const cfg = GESTURE_CONFIG[entry.status] || GESTURE_CONFIG['Normal'];
                const clr = COLOR_MAP[cfg.color] || COLOR_MAP.emerald;
                const isAlert = entry.status !== 'Normal';

                return (
                  <div
                    key={entry.id}
                    className={`flex items-center gap-3.5 p-3 rounded-xl transition-all duration-300 hover:bg-slate-800/30 group ${i === 0 ? 'animate-slide-up bg-slate-800/20' : ''}`}
                  >
                    {/* Icon dot */}
                    <div className={`flex-shrink-0 w-9 h-9 rounded-lg ${clr.bgLight} ${clr.text} flex items-center justify-center border ${clr.border} group-hover:scale-110 transition-transform`}>
                      <span className="text-base">{cfg.icon}</span>
                    </div>

                    {/* Content */}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className={`text-sm font-semibold ${clr.text}`}>{entry.status}</span>
                        <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold tracking-wider uppercase border ${cfg.badgeBg}`}>
                          {isAlert ? 'ALERT' : 'OK'}
                        </span>
                      </div>
                      <div className="text-[10px] text-slate-500 font-mono mt-0.5">
                        {formatTime(entry.timestamp)} · {formatAgo(entry.timestamp)}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────
    //  DEVICE STATUS PANEL
    // ────────────────────────────────────────────────────────────
    function DevicePanel({ isConnected }) {
      const rows = [
        { label: 'Device', value: 'Smart Glove v2.1', highlight: false },
        { label: 'Protocol', value: 'WebSocket / Realtime', highlight: false },
        { label: 'Database', value: 'Supabase PostgreSQL', highlight: false },
        { label: 'Table', value: 'glove_status (id=1)', highlight: true },
      ];

      return (
        <div className="glass rounded-xl gradient-border-green overflow-hidden">
          <div className="p-5 border-b border-slate-800/30 flex items-center gap-3.5">
            <div className="w-12 h-12 rounded-xl overflow-hidden ring-1 ring-white/10">
              <img src="assets/glove-device.png" alt="Smart Glove" className="w-full h-full object-cover" />
            </div>
            <div>
              <h3 className="text-sm font-bold text-slate-200">Device Status</h3>
              <p className="text-[11px] text-slate-500 mt-0.5">Smart Assistive Gesture Glove</p>
            </div>
          </div>

          <div className="p-5 space-y-3.5">
            {/* Connection bar */}
            <div className="flex items-center justify-between">
              <span className="text-xs text-slate-400 font-medium">Connection</span>
              <span className={`text-xs font-bold flex items-center gap-1.5 ${isConnected ? 'text-emerald-400' : 'text-red-400'}`}>
                <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-400 animate-blink' : 'bg-red-500'}`} />
                {isConnected ? 'Active' : 'Offline'}
              </span>
            </div>

            {rows.map((r, i) => (
              <div key={i} className="flex items-center justify-between">

                <span className={`text-xs font-medium ${r.highlight ? 'text-teal-400 font-mono' : 'text-slate-300'}`}>{r.value}</span>
              </div>
            ))}

            {/* Signal quality bar */}
            <div className="pt-3 border-t border-slate-800/30">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs text-slate-400 font-medium">Signal Quality</span>
                <span className={`text-xs font-bold ${isConnected ? 'text-emerald-400' : 'text-red-400'}`}>
                  {isConnected ? 'Excellent' : 'No Signal'}
                </span>
              </div>
              <div className="w-full h-2 bg-slate-800/80 rounded-full overflow-hidden">
                <div className={`h-full rounded-full transition-all duration-1000 ${
                  isConnected
                    ? 'w-[94%] bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400'

                }`} />

            </div>
          </div>
        </div>
      );

    // ────────────────────────────────────────────────────────────
    //  5 GESTURE QUICK-VIEW CARDS
    // ────────────────────────────────────────────────────────────
    function GestureQuickCards({ currentStatus }) {
      return (
        <div className="grid grid-cols-5 gap-3">
          {ALERT_GESTURES.map(g => {
            const cfg = GESTURE_CONFIG[g];
            const clr = COLOR_MAP[cfg.color];
            const isActive = currentStatus === g;

            return (
              <div
                key={g}
                className={`glass-subtle rounded-xl p-4 text-center transition-all duration-300 cursor-default ${
                  isActive ? `ring-2 ${clr.border} scale-[1.04] ${clr.bgLight}` : 'hover:scale-[1.02] hover:bg-slate-800/30'
                }`}
              >
                <div className={`text-2xl mb-2 ${isActive ? 'animate-flash-alert' : ''}`}>{cfg.icon}</div>
                <div className={`text-[11px] font-semibold ${isActive ? clr.text : 'text-slate-400'}`}>{g}</div>
                {isActive && (
                  <div className={`mt-2 inline-flex px-2 py-0.5 rounded-full text-[9px] font-bold ${clr.bgLight} ${clr.text} border ${clr.border}`}>
                    ACTIVE
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────
    //  MAIN APP
    // ────────────────────────────────────────────────────────────
    function App() {
      const [currentStatus, setCurrentStatus] = useState('Normal');
      const [isConnected, setIsConnected] = useState(false);
      const [currentTime, setCurrentTime] = useState(new Date());
      const [history, setHistory] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [lastChanged, setLastChanged] = useState(null);
      const [startTime] = useState(new Date());

      const audioRef = useRef(null);
      const prevStatusRef = useRef('Normal');
      const historyIdRef = useRef(0);

      // Clock
      useEffect(() => {
        const t = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(t);
      }, []);

      // Audio
      useEffect(() => {
        audioRef.current = new Audio(ALARM_SOUND_URL);
        audioRef.current.volume = 0.7;
      }, []);

      // Request notification permission
      useEffect(() => {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      }, []);

      // Trigger alert: sound + browser push notification
      const triggerAlert = useCallback((status) => {
        if (!isMuted && audioRef.current) {
          audioRef.current.currentTime = 0;
          audioRef.current.play().catch(() => {});
        }
        if ('Notification' in window && Notification.permission === 'granted') {
          const cfg = GESTURE_CONFIG[status];
          new Notification(`${cfg?.icon || '🚨'} Smart Glove Alert: ${status}`, {
            body: cfg?.subtitle || `Patient gesture detected — ${status}`,
            icon: 'assets/logo.png',
            tag: 'smartglove-alert',
            requireInteraction: true,
          });
        }
      }, [isMuted]);

      // Add history entry
      const addHistoryEntry = useCallback((status) => {
        historyIdRef.current += 1;
        setHistory(prev => [...prev, { id: historyIdRef.current, status, timestamp: new Date() }]);
      }, []);

      // Process status update
      const handleStatusUpdate = useCallback((newStatus) => {
        const prev = prevStatusRef.current;
        setCurrentStatus(newStatus);
        setLastChanged(new Date());
        addHistoryEntry(newStatus);

        // Alert when transitioning from Normal to any gesture
        if (prev === 'Normal' && ALERT_GESTURES.includes(newStatus)) {
          triggerAlert(newStatus);
        }
        prevStatusRef.current = newStatus;
      }, [addHistoryEntry, triggerAlert]);

      // ──────────────────────────────────────────────────────────
      //  SUPABASE REALTIME SUBSCRIPTION
      //  Connects to the 'glove_status' table and listens for
      //  UPDATE events on the row where id = 1. Each time the
      //  ESP32/microcontroller writes a new gesture value, this
      //  callback fires and updates the entire dashboard.
      // ──────────────────────────────────────────────────────────
      useEffect(() => {
        let channel;

        async function init() {
          try {
            // Fetch initial status
            const { data, error } = await supabase
              .from('glove_status')
              .select('status')
              .eq('id', 1)
              .single();

            if (data && !error) {
              setCurrentStatus(data.status);
              prevStatusRef.current = data.status;
              setLastChanged(new Date());
              addHistoryEntry(data.status);
            }

            // Subscribe to realtime postgres_changes
            channel = supabase
              .channel('glove-realtime-v2')
              .on(
                'postgres_changes',
                {
                  event: 'UPDATE',
                  schema: 'public',
                  table: 'glove_status',
                  filter: 'id=eq.1',
                },
                (payload) => {
                  const newStatus = payload.new.status;
                  console.log('[SmartGlove] Realtime update:', newStatus);
                  handleStatusUpdate(newStatus);
                }
              )
              .subscribe((status) => {
                console.log('[SmartGlove] Channel status:', status);
                setIsConnected(status === 'SUBSCRIBED');
              });
          } catch (err) {
            console.error('[SmartGlove] Init error:', err);
            setIsConnected(false);
          }
        }

        init();
        return () => { if (channel) supabase.removeChannel(channel); };
      }, []);

      // Test notification
      const handleTest = useCallback(() => {
        triggerAlert('Need Help');
        handleStatusUpdate('Need Help');
        setTimeout(() => handleStatusUpdate('Normal'), 3000);
      }, [triggerAlert, handleStatusUpdate]);

      return (
        <div className="min-h-screen flex flex-col relative">
          <ParticlesBg />
          <Header isConnected={isConnected} currentTime={currentTime} />

          <main className="flex-1 max-w-[1600px] w-full mx-auto px-6 lg:px-8 py-6 space-y-6 relative z-10">

            {/* Controls row */}
            <div className="flex items-center justify-between animate-fade-in">
              <h2 className="text-xs font-bold text-slate-500 uppercase tracking-[0.2em]">Current Patient Status</h2>
              <NotificationControls isMuted={isMuted} onToggleMute={() => setIsMuted(m => !m)} onTest={handleTest} />
            </div>

            {/* Hero Alert */}
            <div className="animate-slide-up">
              <HeroAlertCard status={currentStatus} lastChanged={lastChanged} />
            </div>

            {/* 5 Gesture Quick Cards */}
            <div className="animate-slide-up" style={{ animationDelay: '80ms' }}>
              <GestureQuickCards currentStatus={currentStatus} />
            </div>

            {/* Stats */}
            <div className="animate-slide-up" style={{ animationDelay: '160ms' }}>
              <StatsGrid history={history} startTime={startTime} />
            </div>

            {/* Bottom: Chart + Device | History */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-slide-up" style={{ animationDelay: '240ms' }}>
              <div className="lg:col-span-5 space-y-6">
                <GestureChart history={history} />
                <DevicePanel isConnected={isConnected} />
              </div>
              <div className="lg:col-span-7">
                <GestureHistory history={history} />
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/30 py-4 relative z-10">
            <div className="max-w-[1600px] mx-auto px-6 lg:px-8 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-5 h-5 rounded overflow-hidden ring-1 ring-white/5">
                  <img src="assets/logo.png" alt="Logo" className="w-full h-full object-cover" />
                </div>
                <span className="text-[11px] text-slate-600">© 2026 Smart Assistive Gesture Glove · Patient Monitoring System</span>
              </div>
              <span className="text-[11px] text-slate-600 flex items-center gap-1.5">
                Powered by <span className="text-emerald-500 font-semibold">Supabase Realtime</span>
              </span>
            </div>
          </footer>
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
